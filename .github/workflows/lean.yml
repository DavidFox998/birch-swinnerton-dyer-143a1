name: Lean Build - 0 sorry verification
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache elan
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-v1

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Lake build
        run: |
          ~/.elan/bin/lake update
          ~/.elan/bin/lake build

      -       - name: Check 0 sorry
        run: |
          echo "checking Towers/BSD"
          if grep -R --include="*.lean" -E "^[[:space:]]*sorry" Towers/BSD; then
            echo "FOUND REAL SORRY"
            exit 1
          fi
          echo "0 sorry OK"
