      - name: Lake build
        run: |
          lake build 2>&1 | tee build.log
          echo "=== Checking for REAL sorry (not comments) ==="
          # Only fail if we find a standalone 'sorry' tactic, not "0 sorry" in comments
          if grep -rn "^\s*sorry" --include="*.lean" . 2>/dev/null; then
            echo "Found REAL sorry tactic — failing"
            exit 1
          elif grep -rn "[^0-9]sorry[^a-z_]" --include="*.lean" . 2>/dev/null | grep -v "0 sorry" | grep -v "sorry count" | grep -v "sorry\." | grep -v "sorry," | grep -v "Classical trio" | grep -v "\*\*sorry" | grep -q .; then
            echo "Found REAL sorry"
            exit 1
          else
            echo "✅ 0 sorry — clean — only comments mention sorry"
          fi
