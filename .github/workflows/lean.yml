name: Lean Build - 0 sorry verification
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache elan and lake
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake
            lean/.lake
          key: elan-v1-${{ hashFiles('lean-toolchain') }}
          restore-keys: |
            elan-v1-

      - name: Install elan (retry on 503)
        run: |
          if [ -f "$HOME/.elan/bin/elan" ]; then
            echo "elan cached, skipping download"
          else
            for i in 1 2 3 4 5; do
              echo "elan install attempt $i"
              curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh && \
              sh /tmp/elan-init.sh -y --default-toolchain none && break
              echo "failed, sleep $((i*10))s"
              sleep $((i*10))
            done
          fi
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
          ~/.elan/bin/elan --version || true

      - name: Lake build
        run: |
          ~/.elan/bin/lake update
          ~/.elan/bin/lake build

      - name: Check 0 sorry
        run: |
          if grep -R --include="*.lean" -E "^[[:space:]]*sorry" Towers/BSD; then
            echo "FOUND REAL SORRY"
            exit 1
          fi
          echo "0 sorry OK"
