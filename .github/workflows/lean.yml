name: Lean Build - 0 sorry verification
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run aggregate.py
        run: python aggregate.py

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Lake build
        run: |
          ~/.elan/bin/lake update
          ~/.elan/bin/lake build

      - name: Check 0 sorry
        run: |
          if grep -R --include="*.lean" -E "^[[:space:]]*sorry" Towers/BSD lean; then
            echo "FOUND SORRY"; exit 1
          fi
          echo "0 sorry OK"

      - name: Upload Hasse audit
        uses: actions/upload-artifact@v4
        with:
          name: hasse-audit-143a1
          path: |
            ap_table.json
            Towers/BSD/HassePrimeSet.lean
