name: Lean Build - 0 sorry verification
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache elan + lake
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
           .lake
            lean/.lake
          key: lean-${{ hashFiles('lean-toolchain', 'lakefile.*', 'lake-manifest.json') }}-v1

      - name: Install elan
        run: |
          if! command -v elan &> /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Lake update and build
        run: |
          ~/.elan/bin/lake update
          ~/.elan/bin/lake build lean || ~/.elan/bin/lake build
          if [ -f "HassePrimeSet.lean" ]; then
            echo "Checking HassePrimeSet.lean..."
            ~/.elan/bin/lake env lean HassePrimeSet.lean || true
          fi

      - name: Check 0 sorry
        run: |
         ! grep -R "sorry" --include="*.lean" Towers/BSD || (echo "FOUND SORRY" && exit 1)
          echo "0 sorry OK"
