name: Lean Build — 0 sorry verification

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Lake update
        run: |
          lean --version
          lake update || true

      - name: Lake build
        run: |
          lake build 2>&1 | tee build.log
          echo "=== Checking for sorry ==="
          if grep -r "sorry" --include="*.lean" lean/ hasseprimset/ HassePrimeSet.lean BostBound143.lean 2>/dev/null; then
            echo "Found sorry — failing"
            exit 1
          else
            echo "✅ 0 sorry — clean"
          fi
