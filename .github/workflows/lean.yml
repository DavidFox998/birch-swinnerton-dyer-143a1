name: Lean Build - 0 sorry verification
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: true

      - name: Lake update
        run: lake update

      - name: Lake build
        run: lake build

      - name: Check 0 sorry in Towers/BSD
        run: |
          echo "checking for sorry"
          if grep -R --include="*.lean" -E "sorry" Towers/BSD; then
            echo "FOUND SORRY"
            exit 1
          fi
          echo "0 sorry OK"
