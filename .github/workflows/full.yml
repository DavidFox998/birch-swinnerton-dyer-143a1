name: Build full 1061
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build full 1061
        run: |
          python rebuild_full.py
          ls -lh ap_table.json Towers/BSD/HassePrimeSet.lean
          wc -l ap_table.json Towers/BSD/HassePrimeSet.lean
      - name: Upload full artifact
        uses: actions/upload-artifact@v4
        with:
          name: full-1061
          path: |
            ap_table.json
            Towers/BSD/HassePrimeSet.lean
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add ap_table.json Towers/BSD/HassePrimeSet.lean
          git commit -m "full 1061 audit" || echo "no change"
          git push
