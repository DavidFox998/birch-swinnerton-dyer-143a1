name: Run aggregate
on:
  workflow_dispatch:  # adds a "Run workflow" button on website

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run aggregate.py
        run: python aggregate.py
      - name: Commit generated files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add ap_table.json Towers/BSD/HassePrimeSet.lean lean/HassePrimeSet.lean lean/BSD_TimeBound_CLOSED.lean || true
          git commit -m "auto: aggregate HassePrimeSet 1061 primes" || echo "no changes"
          git push
