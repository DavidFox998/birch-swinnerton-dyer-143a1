name: Aggregate hasseprimset -> HassePrimeSet.lean

on:
  push:
    paths:
      - 'hasseprimset/*.lean'
      - 'aggregate.py'

permissions:
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Aggregate 127 files -> 1 file
        run: |
          python3 aggregate.py
          echo "=== Generated ==="
          ls -lh HassePrimeSet.lean
          wc -l HassePrimeSet.lean
          head -20 HassePrimeSet.lean

      - name: Commit HassePrimeSet.lean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add HassePrimeSet.lean
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Auto-aggregate hasseprimset/ (127 files) -> HassePrimeSet.lean [skip ci]"
          git push
