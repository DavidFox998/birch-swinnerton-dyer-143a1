name: Zenodo DOI
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deposit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Zenodo Draft and Publish
        uses: zenodraft/action@0.13.3
        with:
          token: ${{ secrets.ZENODO_TOKEN }}
          concept: # leave empty for first DOI, then put your conceptrecid here after first success
          publish: true
          sandbox: false
          verbose: true
