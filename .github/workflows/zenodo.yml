name: Zenodo DOI
on:
  release:
    types: [published]

jobs:
  deposit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip if token not configured
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: |
          if [ -z "$ZENODO_ACCESS_TOKEN" ]; then
            echo "ZENODO_ACCESS_TOKEN not configured — Zenodo webhook handles archival natively"
            exit 0
          fi

      - name: Publish to Zenodo
        uses: zenodraft/action@0.13.3
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        with:
          upsert-doi: 10.5281/zenodo.21585041
          publish: true
          sandbox: false
          verbose: true
