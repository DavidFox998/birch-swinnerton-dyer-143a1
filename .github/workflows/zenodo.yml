name: Zenodo DOI
on:
  release:
    types: [published]
jobs:
  deposit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fnandor/zenodo-deposit@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          zenodo_token: ${{ secrets.ZENODO_TOKEN }}
          # set to true after your first successful DOI
          publish: true
          sandbox: false
