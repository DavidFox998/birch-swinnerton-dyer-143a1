name: Zenodo DOI
on:
  release:
    types: [published]

jobs:
  deposit:
    runs-on: ubuntu-latest
    env:
      ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Note when token is not configured
        if: env.ZENODO_ACCESS_TOKEN == ''
        run: echo "ZENODO_ACCESS_TOKEN not configured — deposit step skipped, Zenodo webhook handles archival natively"

      - name: Publish to Zenodo
        if: env.ZENODO_ACCESS_TOKEN != ''
        uses: zenodraft/action@0.13.3
        with:
          upsert-doi: 10.5281/zenodo.21585041
          publish: true
          sandbox: false
          verbose: true
