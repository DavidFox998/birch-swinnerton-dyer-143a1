name: Zenodo DOI
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deposit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug Token
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: |
          echo "Token length: ${#ZENODO_TOKEN}"
          curl -s "https://zenodo.org/api/deposit/depositions?access_token=$ZENODO_TOKEN&size=1" -o /tmp/r.txt -w "\nHTTP: %{http_code}\n"
          cat /tmp/r.txt

      - name: Publish to Zenodo
        uses: zenodraft/action@0.13.3
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        with:
          publish: true
          sandbox: false
          verbose: true
